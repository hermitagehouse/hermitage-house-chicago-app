name: Android build (debug)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: "Remove the push plugin from the Android build (Legal Nov 23: no push permission on Android until cleared)"
        run: |
          sed -i '/capacitor-push-notifications/d' android/app/capacitor.build.gradle android/capacitor.settings.gradle
          if grep -q 'capacitor-push-notifications' android/app/capacitor.build.gradle android/capacitor.settings.gradle; then echo '::error::push plugin still in Android build'; exit 1; fi
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
