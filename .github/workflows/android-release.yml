name: Android release bundle (for Google Play)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      UPLOAD_PASSPHRASE: ${{ secrets.UPLOAD_PASSPHRASE }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the upload passphrase secret exists
        run: |
          if [ -z "$UPLOAD_PASSPHRASE" ]; then echo "::error::The GitHub secret UPLOAD_PASSPHRASE is not set. Hannah adds it (Settings > Secrets and variables > Actions) and runs this again."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Get or make the upload key
        run: |
          KS="$RUNNER_TEMP/upload.keystore"
          if [ -f android/upload.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:UPLOAD_PASSPHRASE -in android/upload.keystore.enc -out "$KS" || { echo "::error::Could not open the saved upload key. The passphrase does not match the one used the first time."; exit 1; }
          else
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -storepass "$UPLOAD_PASSPHRASE" -keypass "$UPLOAD_PASSPHRASE" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hermitage House Chicago"
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:UPLOAD_PASSPHRASE -in "$KS" -out android/upload.keystore.enc
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add android/upload.keystore.enc
            git commit -m "Save the encrypted Android upload key (needs the UPLOAD_PASSPHRASE secret to open)"
            git push origin HEAD:main
          fi
          echo "UPLOAD_KEYSTORE=$KS" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KS" -storepass "$UPLOAD_PASSPHRASE" -alias upload | grep -E "SHA1|SHA256|Valid"
      - name: Build the signed bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Show permissions in the final manifest (no AD_ID expected)
        run: |
          f=$(find android/app/build/intermediates -path "*merged_manifests/release*" -name AndroidManifest.xml | head -1)
          echo "$f"; grep -o 'uses-permission[^/]*' "$f" || true
          if grep -q "AD_ID" "$f"; then echo "::error::AD_ID permission is present"; exit 1; fi
          grep -o 'targetSdkVersion="[0-9]*"' "$f" || true
      - uses: actions/upload-artifact@v4
        with:
          name: hermitage-house-chicago-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
