name: iPhone build for TestFlight (signed)
# Run by hand only: Actions > this workflow > Run workflow.
# Uses the four repository secrets Hannah added. Nothing secret is printed or saved.
on:
  workflow_dispatch:
jobs:
  testflight:
    runs-on: macos-latest
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: Check the four secrets exist (names only)
        run: |
          for v in TEAM KEY_ID ISSUER; do
            if [ -z "${!v}" ]; then echo "Missing secret for $v"; exit 1; fi
          done
          if [ -z "${{ secrets.APPSTORE_API_KEY_P8 }}" ]; then echo "Missing APPSTORE_API_KEY_P8"; exit 1; fi
      - name: Check the shape of the IDs (lengths and format only, never the values)
        run: |
          echo "Key ID length: ${#KEY_ID} (should be 10); letters and numbers only: $( [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] && echo yes || echo NO )"
          echo "Issuer ID length: ${#ISSUER} (should be 36); looks like an ID: $( [[ "$ISSUER" =~ ^[0-9a-fA-F-]{36}$ ]] && echo yes || echo NO )"
          echo "Team ID length: ${#TEAM} (should be 10)"
      - name: Put the key file in a temporary place (rebuilt as clean PEM; prints sizes only)
        env:
          P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          OUT="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          python3 - "$OUT" <<'PY'
          import os, re, sys, base64, textwrap
          raw = os.environ["P8"]
          had_header = "BEGIN PRIVATE KEY" in raw
          body = re.sub(r"-----[A-Z ]+-----", "", raw)
          body = re.sub(r"\s+", "", body)
          print("had header:", had_header, "| body characters:", len(body))
          try:
              der = base64.b64decode(body, validate=True)
          except Exception as e:
              print("The secret is not a valid key text (base64 failed). Re-paste the whole .p8 file text.")
              sys.exit(1)
          print("decoded bytes:", len(der), "(an Apple key is about 138)")
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          os.chmod(sys.argv[1], 0o600)
          PY
      - name: Archive without signing (signing happens at the export step)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PL
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
