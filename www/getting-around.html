<body><main><h1>Getting around</h1><div id="box"></div></main><script src="app.js"></script>

         ['Groceries and food',[['Mariano\u2019s','8 min walk','Mariano\u2019s Chicago Clark St'],['Clark St restaurants','2 min walk','Clark Street Chicago Andersonville']]],
         ['Nearby',[['Wrigley Field','10 min by bike','Wrigley Field Chicago'],['Montrose Beach and MonDOG Beach','10 to 12 min drive','Montrose Beach Chicago']]]];

});
