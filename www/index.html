<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hermitage House Chicago</title><link rel="stylesheet" href="app.css">
<style>
.hero{padding:6px 0 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;text-align:center}
.hero .wc{font:400 26px var(--display);font-style:italic;color:var(--soft);margin:12px 0 0}
.hero .mast{margin:0}
main{overflow-x:clip}
.hero{position:relative}.hero .seeds{position:absolute;inset:-6px -24px -90px -24px;z-index:0;pointer-events:none}
.hero .wc,.hero .mast{position:relative;z-index:1}
.map{position:relative;height:290px;border-radius:18px;overflow:hidden;background:#EAE8E1;border:1px solid rgba(0,0,0,.08)}.map svg{width:100%;height:100%}.map .am{position:absolute;left:10px;bottom:6px;font:600 11px sans-serif;color:#555}
.pin{font:600 11px sans-serif}
.lnks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.lnks a,.lnk a{text-align:center;padding:12px 6px;border-radius:14px;background:var(--green);color:#fff;text-decoration:none;font-weight:600}
.lnk{display:flex;gap:10px;margin-top:12px}.lnk a{flex:1;cursor:pointer}
#ev .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(58,42,32,.1);margin:0}#ev .row>*{flex:0 1 auto;padding:0;font-size:inherit}
.rev{background:var(--green);color:#fff;border:0;border-radius:10px;padding:7px 14px;font:600 14px var(--body)}
.wx{display:flex;gap:8px;overflow:auto}.wx div{flex:1 0 74px;background:#fff;border-radius:14px;padding:10px 4px;text-align:center;font-size:13px}.wx b{display:block;font-size:17px}
#ev .row{flex-direction:column;align-items:flex-start;gap:0}#ev .row b{text-align:left;font-weight:500;color:var(--soft);font-size:14.5px}
</style></head>
<body><main>
<div class="hero"><span class="seeds" aria-hidden="true"><img class="seed s1" src="img/seed-green.svg" alt=""><img class="seed s2" src="img/seed-blush.svg" alt=""><img class="seed s3" src="img/seed.svg" alt=""><img class="seed s4" src="img/seed-blush.svg" alt=""><img class="seed s5" src="img/seed-green.svg" alt=""><img class="seed s6" src="img/seed-blush.svg" alt=""><img class="seed s7" src="img/seed-green.svg" alt=""><img class="seed s8" src="img/seed.svg" alt=""><img class="seed s9" src="img/seed-blush.svg" alt=""></span><div class="mast"><img class="wash" src="img/wash.webp" alt=""><div class="h">Hermitage</div><div class="s">House</div><div class="c">Chicago</div><div class="a">Andersonville</div></div><div class="wc" id="wc">Welcome home</div>

<g stroke="#fff" stroke-width="7"><line x1="0" y1="120" x2="340" y2="95"/><line x1="0" y1="200" x2="340" y2="190"/><line x1="130" y1="0" x2="150" y2="215"/><line x1="270" y1="0" x2="265" y2="215"/></g><g stroke="#fff" stroke-width="3.5"><line x1="0" y1="60" x2="340" y2="50"/><line x1="60" y1="0" x2="70" y2="215"/><line x1="200" y1="0" x2="205" y2="215"/></g>
<line x1="0" y1="35" x2="340" y2="30" stroke="#C8102E" stroke-width="5"/><line x1="0" y1="168" x2="340" y2="160" stroke="#6B4A2B" stroke-width="5"/>
<circle cx="170" cy="112" r="10" fill="#C8102E" stroke="#fff" stroke-width="3"/><text class="pin" x="102" y="136" fill="#222">Hermitage House</text>
<g class="pin"><circle cx="270" cy="31" r="6" fill="#fff" stroke="#C8102E" stroke-width="3"/><text x="205" y="22" fill="#222">Lawrence · 15 min</text><circle cx="60" cy="168" r="6" fill="#fff" stroke="#6B4A2B" stroke-width="3"/><text x="60" y="186" fill="#222">Damen · 16 min</text><rect x="196" y="76" width="9" height="9" fill="#1B3358"/><text x="208" y="80" fill="#222">Metra · 8 min</text><rect x="228" y="150" width="9" height="9" fill="#2E7D32"/><text x="226" y="178" fill="#222">Mariano's · 8 min</text></g></svg><div class="am">Map sketch, not to scale.</div></div>

<script>
var LINKS=[['Red Line','/redline/'],['Brown Line','/brownline/'],['Metra','https://metra.com'],['Bus routes','/bus/']];
LINKS.forEach(function(l){var a=el('a',l[0]);a.href='#';a.onclick=function(e){e.preventDefault();var u=l[1].indexOf('http')===0?l[1]:'https://www.transitchicago.com'+l[1];if(P.Browser)P.Browser.open({url:u});else window.open(u,'_blank')};document.getElementById('lnks').appendChild(a)});

function D(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function full(s){var d=D(s);return ['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()}
function sheet(title,fill){openSheet(title,fill)}
var DET=null;
window.onStay=function(d){var first=(d.name||'').split(' ')[0];if(first)document.getElementById('wc').textContent='Welcome home, '+first;loadWeather(d.start,d.end);loadEvents(d.start,d.end)};
window.onDetails=function(det){DET=det;if(window.showRealMap)window.showRealMap(det&&!det.sample&&!/sample/i.test(det.address||'')?det.address:null)};
document.getElementById('air').onclick=function(e){e.preventDefault();sheet('Getting here',function(b){
  b.appendChild(el('h3','Driving'));b.appendChild(el('p','From O\u2019Hare (ORD) or Midway (MDW) the drive is about 30 to 45 minutes, longer in rush hour.'));
  var det=DET;if(det&&det.address&&!det.sample&&!/sample/i.test(det.address)){[['O\u2019Hare','O\u2019Hare International Airport'],['Midway','Midway International Airport']].forEach(function(r){var a=el('a','Driving directions from '+r[0],'btn');a.style.marginTop='8px';a.href='https://maps.apple.com/?dirflg=d&saddr='+encodeURIComponent(r[1])+'&daddr='+encodeURIComponent(det.address);a.onclick=function(e){e.preventDefault();var u=this.href;if(P.Browser)P.Browser.open({url:u});else window.open(u,'_blank')};b.appendChild(a)})}
  b.appendChild(el('h3','By train'));
  b.appendChild(el('p','From O\u2019Hare (ORD): Blue Line to Jackson, switch to the Red Line toward Howard, get off at Lawrence. About 1 hour 15 minutes.'));
  b.appendChild(el('p','From Midway (MDW): Orange Line to Roosevelt, switch to the Red Line toward Howard, get off at Lawrence. About 1 hour.'));
  b.appendChild(el('p','Times are rough and change with traffic.','note'));
})};
function loadEvents(s,e){var a=D(s),z=D(e),y=a.getFullYear();
 var E=[['Restaurant Week','usually late January into early February',[1,20],[2,5]],['Chicago Auto Show','usually mid February',[2,8],[2,17]],['St. Patrick’s Day parades','around March 17',[3,10],[3,18]],['Chicago Marathon','early October',[10,6],[10,14]],['Pride Parade','last Sunday of June',[6,24],[6,30]],['Lollapalooza','around the start of August',[7,28],[8,5]],['Air and Water Show','mid August',[8,14],[8,22]],['Thanksgiving, Christkindlmarket','November into December',[11,15],[12,24]]];
 var box=document.getElementById('ev'),n=0;
 E.forEach(function(x){for(var yy=y;yy<=z.getFullYear();yy++){var s0=new Date(yy,x[2][0]-1,x[2][1]),e0=new Date(yy,x[3][0]-1,x[3][1]);if(s0<=z&&e0>=a){var r=el('div','','row');r.appendChild(el('span',x[0]));r.appendChild(el('b',x[1]));box.appendChild(r);n++;break}}});
 if(!n)box.appendChild(el('p','No big city events usually fall in your dates.'));
 box.appendChild(el('p','Typical timing, not exact dates.','note'))}
function loadWeather(s,e){var a=D(s),z=D(e),box=document.getElementById('wx'),note=document.getElementById('wxn');
 function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
 var A=iso(a),Z=iso(z);
 fetch(SITE+'/api/weather',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
  box.innerHTML='';
  if(!j||!j.ok||!j.days){box.style.display='none';note.style.display='none';if(box.previousElementSibling&&box.previousElementSibling.tagName==='H2')box.previousElementSibling.style.display='none';return}
  var ds=j.days.filter(function(x){return x.date>=A&&x.date<=Z});
  if(!ds.length){box.innerHTML='';note.textContent='The forecast shows about a week before you arrive.';return}
  var step=Math.max(1,Math.ceil(ds.length/6));
  for(var i=0;i<ds.length;i+=step){var x=ds[i],dt=x.date.split('-'),d=el('div');d.appendChild(el('span',MO[+dt[1]-1]+' '+(+dt[2])));d.appendChild(el('b',(x.high==null?(x.low==null?'':x.low):x.high)+'\u00b0'));d.appendChild(el('span',String(x.short||'').split(' then ')[0]));box.appendChild(d)}
  note.textContent=(j.credit||'Forecast: National Weather Service')+'.'+(ds[ds.length-1].date<Z?' The rest shows closer to your dates.':'')}).catch(function(){box.innerHTML='';note.textContent='Weather could not load right now.'})}
</script><script>setTimeout(function(){if(window.showRealMap)window.showRealMap(null)},8000)</script><script src="staypage.js"></script></body></html>
