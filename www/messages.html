<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Messages</title><link rel="stylesheet" href="app.css"></head>
<body><main><h1>Messages</h1>
<div id="chat"></div>
</main><script src="app.js"></script>
<script>

var chat=document.getElementById('chat');
function tm(x){var d=new Date(x);if(isNaN(d))return String(x||'');return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function tmShort(x){var d=new Date(x);if(isNaN(d))return String(x||'');return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(' ','').toLowerCase()}
function realChat(){
  var stays=[],cur=null,timer=null,meName='';
  var top=el('div'),box=el('div'),form=el('div');chat.appendChild(top);chat.appendChild(box);chat.appendChild(form);
  var note=el('p',"Messages here go to everyone on this stay and to your hosts, Hannah and Vlad, and are kept with your stay. Everyone in this conversation can see when a message was sent and when it was read. Please don\u2019t send card or bank details here. In an emergency, call 911.",'note');
  function reportMsg(m){openSheet('Report this message',function(b){
    b.appendChild(el('p','This sends the message to your hosts, Hannah and Vlad, so they can look at it. Tell them why if you like.'));
    var t=el('textarea');t.rows=3;t.maxLength=300;t.placeholder='Why are you reporting it? (optional)';b.appendChild(t);
    var g=el('button','Send report');g.style.marginTop='12px';var o=el('p','');
    g.onclick=function(){g.disabled=true;acctCall('/api/account/report',{id:cur,msgId:m.id,reason:t.value}).then(function(d){g.disabled=false;o.className=d.ok===false?'err':'ok';o.textContent=d.message||(d.ok===false?'That did not send. Try again.':'Thank you. The hosts will look at it.');if(d.ok!==false)g.hidden=true})};
    b.appendChild(g);b.appendChild(o)})}
  function blockMsg(m){openSheet('Block this person',function(b){
    b.appendChild(el('p','You won\u2019t see '+(m.who||'this person')+'\u2019s messages. Your hosts, Hannah and Vlad, will be told.'));
    var g=el('button','Block this person');g.style.marginTop='12px';var o=el('p','');
    g.onclick=function(){g.disabled=true;acctCall('/api/account/block',{id:cur,msgId:m.id}).then(function(d){o.className=d.ok===false?'err':'ok';if(d.ok===false){g.disabled=false;o.textContent=d.message||'That did not work. Try again.';return}
      o.textContent='You won\u2019t see their messages. Your hosts have been told.';g.hidden=true;load()})};
    b.appendChild(g);b.appendChild(o)})}
  function paint(d){
    box.innerHTML='';form.innerHTML='';
    if(d.archived){var cs=stays.filter(function(x){return String(x.id)===String(cur)})[0];box.appendChild(el('p',cs&&cs.status==='cancelled'?'This stay was cancelled. This conversation is saved with the stay\u2019s records.':'This conversation is closed. Your messages are saved with your stay.','note'))}
    (d.items||[]).forEach(function(m){var mine=m.from==='guest'&&(!meName||m.who===meName);var b=el('div','','bub'+(mine?' me':'')+(m.from==='host'?' host':''));if(!mine){var wh=el('div','','who2');wh.appendChild(avatar(m.who||'Your host'));wh.appendChild(el('b',m.who||'Your host'));b.appendChild(wh)}b.appendChild(el('div',m.text));
      var line=tm(m.at);
      if(mine){var r=Object.keys(m.reads||{}).filter(function(k){return k!=='guest'}).map(function(k){return k+', '+tmShort(m.reads[k])});line+=' \u00b7 '+(r.length?'Read by '+r.join(' and '):'Sent, not read yet')}
      b.appendChild(el('small',line));
      if(!mine&&m.id!==undefined){var rp=el('a','Report');rp.href='#';rp.style.cssText='font-size:13px;display:inline-block;margin-top:2px';rp.onclick=function(ev){ev.preventDefault();reportMsg(m)};b.appendChild(rp);if(m.from==='guest'){var bk=el('a','Block this person');bk.href='#';bk.style.cssText='font-size:13px;display:inline-block;margin:2px 0 0 14px';bk.onclick=function(ev){ev.preventDefault();blockMsg(m)};b.appendChild(bk)}}
      box.appendChild(b)});
    if(!(d.items||[]).length)box.appendChild(el('p','No messages yet. Say hello to your hosts below.'));
    if(d.canSend===false){form.appendChild(el('p',d.archived?'You can still write to your hosts. Their reply comes by email, not in Messages.':(d.message||''),'note'));if(d.archived){var nm=el('a','Write to your hosts','btn alt');nm.href='contact.html';nm.style.marginTop='10px';form.appendChild(nm)}}
    else{var t=el('textarea');t.rows=3;t.maxLength=2000;t.placeholder='Write a message';t.style.marginTop='12px';form.appendChild(t);
      var s=el('button','Send');s.style.marginTop='8px';var er=el('p','','err');form.appendChild(s);form.appendChild(er);
      s.onclick=function(){var v=t.value.trim();if(!v)return;s.disabled=true;er.textContent='';
        acctCall('/api/account/messages',{id:cur,text:v}).then(function(r){s.disabled=false;if(r.ok===false){er.textContent=r.message||'Could not send. Try again.';if(r.items)paint(r);return}t.value='';paint(r)})}}
    form.appendChild(note.cloneNode(true));
  }
  var lastSig='';function load(){if(!cur)return;acctCall('/api/account/messages?id='+encodeURIComponent(cur)).then(function(d){if(d.signedOut)return;if(d.ok===false){box.innerHTML='';box.appendChild(el('p',d.message||'Could not load messages. Try again.','err'));return}
    var sig=JSON.stringify(d);if(sig===lastSig)return;lastSig=sig;var typing=document.querySelector('#chat textarea');var keep=typing?typing.value:'',foc=typing&&document.activeElement===typing,a1=typing?typing.selectionStart:0,a2=typing?typing.selectionEnd:0;paint(d);var t2=document.querySelector('#chat textarea');if(t2&&keep){t2.value=keep;if(foc){t2.focus();try{t2.setSelectionRange(a1,a2)}catch(e){}}}})}
  acctCall('/api/account/me').then(function(m){
    if(!m.me){box.appendChild(el('p',m.message||'Could not load your stays. Try again.','err'));return}
    meName=(m.me&&m.me.name)||'';stays=m.stays||[];kv('stay').then(function(v){cur=v?JSON.parse(v).id:(stays[0]&&stays[0].id);
      if(stays.length>1){var l=el('label','Stay');l.htmlFor='sp';top.appendChild(l);var sel=document.createElement('select');sel.id='sp';
        stays.forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=(x.start?us(x.start):'')+' to '+(x.end?us(x.end):'')+(x.unread?' ('+x.unread+' new)':'');sel.appendChild(o)});sel.value=cur;sel.onchange=function(){cur=sel.value;lastSig='';load()};top.appendChild(sel)}
      load();timer=setInterval(function(){if(!document.hidden)load()},8000)})});
}
if(!DEMO){realChat();
}else{
  chat.appendChild(el('p','Messages here go to your hosts, Hannah and Vlad, and are kept with your stay. Please don\u2019t send card or bank details here. In an emergency, call 911.','note'));
  var M=[['Hannah','Welcome! Your place is ready from 3pm on Jan 10. Door code and Wi-Fi show in My Stay the day before.','Jan 8, 3:02 PM','Read by you'],
         ['me','Thank you! We land around 2. Is early drop-off for bags okay?','Jan 8, 3:20 PM','Read by Hannah, Vlad'],
         ['Vlad','Yes, bags are fine. Text or message when you are close.','Jan 8, 4:05 PM','Read by you'],
         ['Sample Guest 2','Hi! I am staying on this trip too (a made-up sample message from a second sample guest).','Jan 9, 9:10 AM','Sample','guest']];
  var box=el('div');chat.appendChild(box);
  function add(m){var b=el('div','','bub'+(m[0]==='me'?' me':'')+(m[0]!=='me'&&m[4]!=='guest'?' host':''));if(m[0]!=='me'){var wh=el('div','','who2');wh.appendChild(avatar(m[0]));wh.appendChild(el('b',m[0]));b.appendChild(wh)}b.appendChild(el('div',m[1]));b.appendChild(el('small',m[2]+' \u00b7 '+m[3]));
    if(m[0]!=='me'){var rp=el('a','Report');rp.href='#';rp.style.cssText='font-size:13px;display:inline-block;margin-top:2px';rp.onclick=function(ev){ev.preventDefault();openSheet('Report this message',function(sb){sb.appendChild(el('p','This is a sample stay, so nothing is sent. With a real stay, this sends the message to your hosts, Hannah and Vlad.'));var sg=el('button','Send report');sg.style.marginTop='12px';var so=el('p','','ok');sg.onclick=function(){sg.hidden=true;so.textContent='Thank you. The hosts will look at it. (Sample stay: nothing was sent.)'};sb.appendChild(sg);sb.appendChild(so)})};b.appendChild(rp);
      if(m[4]==='guest'){var bk=el('a','Block this person');bk.href='#';bk.style.cssText='font-size:13px;display:inline-block;margin:2px 0 0 14px';bk.onclick=function(ev){ev.preventDefault();openSheet('Block this person',function(sb){sb.appendChild(el('p','You won\u2019t see Sample Guest 2\u2019s messages. Your hosts will be told. (Sample stay: nothing is sent.)'));var sg=el('button','Block this person');sg.style.marginTop='12px';var so=el('p','','ok');sg.onclick=function(){sg.hidden=true;so.textContent='You won\u2019t see their messages. Your hosts have been told.';b.remove();closeSheet()};sb.appendChild(sg);sb.appendChild(so)})};b.appendChild(bk)}}
    box.appendChild(b)}
  M.forEach(add);
  chat.appendChild(el('textarea','','')).id='t';var t=document.getElementById('t');t.rows=3;t.placeholder='Write a message';t.style.marginTop='12px';
  var s=el('button','Send');s.style.marginTop='8px';chat.appendChild(s);
  s.onclick=function(){if(!t.value.trim())return;add(['me',t.value.trim(),stamp(),'Sent, not read yet']);t.value=''};
  chat.appendChild(el('p','Sample conversation. Everyone in the chat sees who has read each message, and when it was sent.','note'));
}

</script></body></html>
