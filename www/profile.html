<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Profile</title><link rel="stylesheet" href="app.css">
<style>
.who{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.tile-i{width:64px;height:64px;border-radius:16px;background:var(--blush);display:flex;align-items:center;justify-content:center;font:400 30px var(--display);color:var(--ink);flex:none}
.who b{font:400 24px var(--display);display:block}.who span{color:var(--soft);font-size:15px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(58,42,32,.1)}.row span{color:var(--soft)}.row b{text-align:right;font-weight:500;word-break:break-word}
</style></head>
<body><main><h1>Profile</h1><div id="box"></div></main><script src="app.js"></script>
<script>
var box=document.getElementById('box');
function draw(p){
  box.innerHTML='';
  var c=el('div','','card');
  var w=el('div','','who');w.appendChild(el('div',((p.name||'?').trim()[0]||'?').toUpperCase(),'tile-i'));
  var t=el('div');t.appendChild(el('b',p.name||'Your name'));t.appendChild(el('span',p.email||''));w.appendChild(t);c.appendChild(w);
  function r(l,v){var d=el('div','','row');d.appendChild(el('span',l));d.appendChild(el('b',v||'Not added'));c.appendChild(d)}
  r('Phone',p.phone);r('Other guests with you',p.others);r('Pets',p.pets);r('Password','••••••••');
  var eb=el('button','Edit profile');eb.style.marginTop='14px';eb.onclick=function(){editProfile(p)};c.appendChild(eb);
  var pb=el('button','Change password','alt');pb.onclick=function(){changePw()};c.appendChild(pb);
  box.appendChild(c);
  box.appendChild(el('h2','Notifications'));
  var n=el('div','','card');
  function cb(label,on,key){var l=el('label','','ck');l.style.cssText='display:flex;gap:10px;align-items:center;margin:8px 0';var k=document.createElement('input');k.type='checkbox';k.checked=!!on;k.style.width='auto';k.onchange=function(){p[key]=k.checked;kvSet('profile',JSON.stringify(p)).then(function(){if(DEMO||key!=='nEmail'){ok.textContent='Saved.';return}acctCall('/api/account/profile',{notify:{email:k.checked}}).then(function(d){ok.className=d.ok===false?'err':'ok';ok.textContent=d.ok===false?(d.message||'Could not save. Try again.'):'Saved.'})})};l.appendChild(k);l.appendChild(document.createTextNode(label));n.appendChild(l)}
  var ok=el('p','','ok');
  cb('Email me when I have a new message',p.nEmail,'nEmail');
  n.appendChild(el('p','We never put message text in an email.','note'));n.appendChild(ok);box.appendChild(n);
  var svc=el('div');box.appendChild(svc);kv('stay').then(function(v){if(!v)return;var S0=JSON.parse(v);svc.appendChild(el('h2','Request service or report a problem'));if(DEMO){svc.appendChild(el('p','With a real stay, this sends a note and one optional photo to your hosts. (Sample stay: nothing is sent.)','note'));return}problemForm(svc,S0)});
  box.appendChild(el('h2','Past stays'));
  var ps=el('div','','card');box.appendChild(ps);
  function pastRow(apt,a,b){var r=el('p','','kv');r.appendChild(el('strong','Apartment '+apt));r.appendChild(el('span',us(a)+' - '+us(b)));ps.appendChild(r)}
  function noPast(){ps.appendChild(el('p','Stays you have finished will be kept here, so you can look back at them.','note'))}
  if(DEMO){pastRow('2','2026-03-03','2026-03-17');ps.appendChild(el('p','Sample only.','note'))}
  else kv('token').then(function(tk){if(!tk){noPast();return}acctCall('/api/account/me').then(function(m){var n=new Date(),td=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);
    var old=((m&&m.stays)||[]).filter(function(x){return x.end&&x.end<td&&x.status!=='cancelled'}).sort(function(a,b){return a.start<b.start?1:-1});
    if(!old.length){noPast();return}old.forEach(function(x){pastRow(x.apt,x.start,x.end)})})});
  box.appendChild(el('h2','Your account'));
  var so=el('button','Sign out','alt');so.onclick=function(){if(DEMO){leaveDemo();location.href='index.html'}else acctCall('/api/account/signout',{}).then(function(){leaveDemo();location.href='signin.html'})};box.appendChild(so);
  var d=el('a','Delete my account');d.href='#';d.style.cssText='display:block;margin-top:16px;color:#A33';
  d.onclick=function(ev){ev.preventDefault();if(DEMO){if(confirm('This is the sample stay. Leave it?')){leaveDemo();location.href='signin.html'}return}delAcct()};box.appendChild(d);
}
function field(b,id,label,val,type){var l=el('label',label);l.htmlFor=id;b.appendChild(l);var i=document.createElement('input');i.id=id;i.value=val||'';if(type)i.type=type;b.appendChild(i);return i}
function editProfile(p){openSheet('Edit your profile',function(b){
  var n=field(b,'n','Your name',p.name),em=field(b,'em','Email',p.email,'email'),ph=field(b,'ph','Phone',p.phone,'tel'),o=field(b,'o','Other guests with you',p.others),pt=field(b,'pt','Pets (name, type)',p.pets);
  var s=el('button','Save');s.style.marginTop='12px';var m=el('p','','ok');
  s.onclick=function(){
    var nv={name:n.value.trim(),email:em.value.trim(),phone:ph.value.trim(),others:o.value.trim(),pets:pt.value.trim()};
    if(DEMO){Object.assign(p,nv);kvSet('profile',JSON.stringify(p)).then(function(){closeSheet();draw(p)});return}
    var body={};['name','email','phone','pets'].forEach(function(k){if(nv[k]!==(p[k]||''))body[k]=nv[k]});
    if(nv.others!==(p.others||''))body.others=nv.others?nv.others.split(/\s*(?:,|;| and )\s*/).filter(Boolean).map(function(x){return{name:x}}):[];
    if(!Object.keys(body).length){closeSheet();return}
    s.disabled=true;m.className='note';m.textContent='Saving…';
    acctCall('/api/account/profile',body).then(function(d){
      if(d.ok===false||d.signedOut){s.disabled=false;m.className='err';m.textContent=d.message||'Could not save. Try again.';return}
      if(d.me)Object.assign(p,profileFrom(d.me,p));else Object.assign(p,nv);
      kvSet('profile',JSON.stringify(p)).then(function(){closeSheet();draw(p)})});
  };
  b.appendChild(s);b.appendChild(m);if(DEMO)b.appendChild(el('p','Sample stay: saved on this phone only.','note'))})}
function changePw(){openSheet('Change your password',function(b){
  var a=field(b,'cp','Current password','','password'),n=field(b,'np','New password','','password'),c=field(b,'cn','New password again','','password');
  var m=el('p','','err');var s=el('button','Save new password');s.style.marginTop='12px';
  s.onclick=function(){if(!a.value||!n.value){m.textContent='Fill in all three boxes.';return}if(n.value.length<8){m.textContent='Use at least 8 characters.';return}if(n.value!==c.value){m.textContent='The two new passwords do not match.';return}if(DEMO){m.className='ok';m.textContent='Done. (Sample stay: nothing was changed.)';return}s.disabled=true;m.className='note';m.textContent='Saving…';acctCall('/api/account/password',{current:a.value,password:n.value}).then(function(d){s.disabled=false;if(d.ok===false){m.className='err';m.textContent=d.message||'Could not change it. Check your current password.';return}m.className='ok';m.textContent='Done. Your password was changed.'})};
  b.appendChild(s);b.appendChild(m)})}
function delAcct(){openSheet('Delete my account',function(b){
  b.appendChild(el('p','This removes your account and sign-in. Hermitage House keeps your stay record and messages as booking records. Type your password to confirm.'));
  var pw=field(b,'dp','Password','','password'),m=el('p','','err');var s=el('button','Delete my account');s.style.cssText='margin-top:12px;background:#A33';
  s.onclick=function(){if(!pw.value){m.textContent='Type your password.';return}s.disabled=true;acctCall('/api/account/delete',{password:pw.value}).then(function(d){if(d.ok===false){s.disabled=false;m.textContent=d.message||'Could not delete. Check your password.';return}leaveDemo();location.href='signin.html'})};
  b.appendChild(s);b.appendChild(m)})}
function drawVisitor(){
  box.innerHTML='';
  vGet().then(function(v){
    var c=el('div','','card');c.appendChild(el('h3','Your details'));
    c.appendChild(el('p','Saved on this phone only. We don\u2019t see these until you send a request or a message.','note'));
    var n=field(c,'vn','Your name',v.name),e=field(c,'ve','Email',v.email,'email'),ph=field(c,'vp','Phone',v.phone,'tel');
    var s=el('button','Save');s.style.marginTop='12px';var m=el('p','','ok');
    s.onclick=function(){vSet({name:n.value.trim(),email:e.value.trim(),phone:ph.value.trim()}).then(function(){m.textContent='Saved on this phone.'})};
    c.appendChild(s);c.appendChild(m);box.appendChild(c);
    box.appendChild(el('h2','Your account'));
    box.appendChild(el('p','When you book a stay with us, your account is made for you. You sign in with the email or phone on the booking, and your stay, messages and door code appear here.','note'));
    var si=el('button','I have a booking: sign in','alt');si.onclick=function(){LS.removeItem('visitor');location.href='signin.html'};box.appendChild(si);
    var d=el('a','Clear my details from this phone');d.href='#';d.style.cssText='display:block;margin-top:16px';d.onclick=function(ev){ev.preventDefault();kvDel('vprofile');LS.removeItem('visitor');location.href='signin.html'};box.appendChild(d);box.appendChild(el('p','This removes them from this phone. Anything you already sent us stays with your request or message.','note'))})}
kv('stay').then(function(st){ if(!st&&LS.getItem('visitor')==='1'){drawVisitor();return} loadProfile() });
function loadProfile(){
kv('profile').then(function(v){
  if(!v){box.appendChild(el('p','Sign in to see and edit your details.'));var a=el('a','Sign in','btn');a.href='signin.html';box.appendChild(a);return}
  var pr=JSON.parse(v);draw(pr);
  if(!DEMO)acctCall('/api/account/me').then(function(d){if(d.me){var np=profileFrom(d.me,pr);kvSet('profile',JSON.stringify(np));if(!document.querySelector('.sheet'))draw(np)}});
});
}
</script></body></html>
