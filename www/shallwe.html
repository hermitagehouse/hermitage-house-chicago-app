<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ShallWe</title><link rel="stylesheet" href="app.css"></head>
<body><main><a class="back" href="index.html">Back</a><h1>Places we love</h1>
<p id="st" class="note">Loading.</p><div id="list"></div>
<button class="alt" id="plan">Ask Hannah to plan a night</button>
</main><script src="app.js"></script>
<script>
var list=document.getElementById('list'),st=document.getElementById('st'),fav={};
document.getElementById('plan').onclick=function(){openSite('/shallwe-plan.html')};
function draw(items){
  list.textContent='';
  items.forEach(function(p){
    var name=p.name||p.title; if(!name)return;
    var c=el('div','','card'); c.appendChild(el('h3',name));
    var sub=[p.type,p.hood,p.price].filter(Boolean).join(' · '); if(sub)c.appendChild(el('p',sub,'note'));
    var d=p.note||''; if(d)c.appendChild(el('p',String(d).slice(0,300)));
    var q=p.address||name+' Chicago'; 
    var row=el('div','','row');
    var f=el('button',fav[name]?'Saved':'Save','alt'); f.onclick=function(){fav[name]=!fav[name];kvSet('fav',JSON.stringify(fav));f.textContent=fav[name]?'Saved':'Save'};
    row.appendChild(f);
    var m=el('button','Map','alt'); m.onclick=function(){var u='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);if(P.Browser)P.Browser.open({url:u});else window.open(u)}; row.appendChild(m);
    var s=el('button','Share','alt'); s.onclick=function(){var t=name+' - from Hermitage House Chicago';if(P.Share)P.Share.share({text:t});else if(navigator.share)navigator.share({text:t})}; row.appendChild(s);
    c.appendChild(row); list.appendChild(c);
  });
}
function pick(d){ if(Array.isArray(d))return d; if(d&&Array.isArray(d.places))return d.places; if(d&&Array.isArray(d.items))return d.items; if(d&&d.places&&typeof d.places==='object')return Object.values(d.places); return []; }
kv('fav').then(function(v){fav=v?JSON.parse(v):{}; return kv('guide')}).then(function(cached){
  if(cached){draw(JSON.parse(cached)); st.textContent='Saved on this phone. Updating.'}
  api('/api/guide').then(function(d){var items=pick(d); if(items.length){kvSet('guide',JSON.stringify(items));draw(items);st.textContent=''}else if(!cached)st.textContent='Could not load places. Check your connection.'; else st.textContent='Showing places saved on this phone.'});
});
</script></body></html>
