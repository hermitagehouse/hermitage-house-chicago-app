<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sign in</title><link rel="stylesheet" href="app.css">
<style>.si{position:relative;padding:8px 0 30px}.si .mast{transform:scale(.95);margin:6px 0 4px}.si .wc{font:italic 400 24px var(--display);color:var(--soft);text-align:center;margin:0 0 10px}.si form{position:relative;z-index:1}.si .seeds{position:absolute;inset:0;pointer-events:none;z-index:0}.si .card{position:relative;z-index:1}</style></head>
<body><main><div class="si">
<span class="seeds" aria-hidden="true"><img class="seed s1" src="img/seed-green.svg" alt=""><img class="seed s3" src="img/seed.svg" alt=""><img class="seed s5" src="img/seed-blush.svg" alt=""><img class="seed s7" src="img/seed-green.svg" alt=""><img class="seed s6" src="img/seed-blush.svg" alt=""></span>
<div class="mast" style="position:relative;z-index:1"><img class="wash" src="img/wash.webp" alt=""><div class="h">Hermitage</div><div class="s">House</div><div class="c">Chicago</div><div class="a">Andersonville</div></div>
<p class="wc">Welcome home</p>
<div class="card"><form id="f" novalidate><label for="e">Email or phone you booked with</label><input id="e" type="text" autocomplete="username" autocapitalize="none" autocorrect="off"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
<p id="out" class="err" role="alert" style="margin-top:10px"></p>
<div class="btnrow"><button type="submit" id="go">Sign in</button></div>
<p style="text-align:center;margin:16px 0 0"><a href="#" id="mk" style="color:var(--ink);font-weight:600">Create your account</a></p>
<p style="text-align:center;margin:10px 0 0"><a href="#" id="fg" style="color:var(--ink)">Forgot your password?</a></p></form></div>
<div class="card" style="margin-top:18px"><h3>Not booked yet?</h3><p class="note">See which dates are open, send us a request, or write to us with a question.</p><button type="button" id="vs">See availability and request a stay</button></div>
<div class="card" style="margin-top:18px"><h3>Just looking?</h3><p class="note">Look around the app with a sample stay. Nothing in it is real and nothing is sent.</p><button type="button" class="alt" id="sm">Look around with a sample stay</button></div>
</div></main><script src="app.js"></script>
<script>
var out=document.getElementById('out');
function val(){return document.getElementById('e').value.trim()}
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();out.className='err';
  var e=val(),pw=document.getElementById('p').value;
  if(!e||!pw){out.textContent='Enter the email or phone you booked with and your password.';return}
  var b=document.getElementById('go');b.disabled=true;out.className='note';out.textContent='Signing in…';
  acctCall('/api/account/signin',{login:e,password:pw,stay:true,client:'app'}).then(function(d){
    if(!d.ok||!d.token){b.disabled=false;out.className='err';out.textContent=d.message||'That email or phone and password did not match.';return}
    if(d.role==='host'&&!HOST_ON){fetch(SITE+'/api/host/signout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+d.token},body:'{}'}).catch(function(){});b.disabled=false;out.className='err';out.textContent='The host side of the app is not ready yet. Please use the manage page for now.';return}
    if(d.role==='host'){LS.removeItem('demo');LS.removeItem('travel');kvSet('htoken',d.token).then(function(){return kvSet('hname',d.name||'')}).then(function(){location.href='host.html'});return}
    LS.removeItem('demo');
    kvSet('token',d.token).then(function(){return acctCall('/api/account/me')}).then(function(m){
      if(!m.me){b.disabled=false;out.className='err';out.textContent=m.message||'Something went wrong. Try again.';return}
      var s=pickStay(m.stays);
      if(!s){acctCall('/api/account/signout',{}).then(function(){leaveDemo();b.disabled=false;out.className='err';out.textContent='You are signed in, but there is no stay on this account yet. Please message Hannah.'});return}
      kvSet('stay',JSON.stringify({id:String(s.id),t:'acct'})).then(function(){return kvSet('profile',JSON.stringify(profileFrom(m.me)))}).then(function(){location.href='index.html'});
    });
  });
};
function lf(b,id,label,ph){var l=el('label',label);l.htmlFor=id;b.appendChild(l);var i=document.createElement('input');i.id=id;i.type='text';i.autocapitalize='none';i.setAttribute('autocorrect','off');i.value=val();if(ph)i.placeholder=ph;b.appendChild(i);return i}
var FAIL='Something went wrong. Try again.';
function fl(b,id,label,type,v){var l=el('label',label);l.htmlFor=id;b.appendChild(l);var i=document.createElement('input');i.id=id;i.type=type||'text';i.autocapitalize='none';i.setAttribute('autocorrect','off');if(v)i.value=v;b.appendChild(i);return i}
function stepNote(b,n){var p=el('p','Step '+n+' of 3','note');p.style.cssText='margin:0 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase';b.appendChild(p)}
function lnk(b,text,fn){var p=el('p');p.style.cssText='text-align:center;margin:12px 0 0';var a=el('a',text);a.href='#';a.style.color='var(--ink)';a.onclick=function(ev){ev.preventDefault();fn()};p.appendChild(a);b.appendChild(p);return p}
function backToSignIn(login){return function(){if(login)document.getElementById('e').value=login;closeSheet()}}
function createAcct(pre,preDate){openSheet('Create your account',function(b){
  stepNote(b,1);b.appendChild(el('p','Accounts are for guests who have booked with us. First, let us find your booking.'));
  var lg=fl(b,'cl','Email or phone number on your booking','text',pre||val()),dt=fl(b,'cd','Check-in date','date',preDate||'');lg.autocomplete='username';
  var m=el('p','','err');m.setAttribute('role','alert');var g=el('button','Find my booking');g.style.marginTop='12px';
  g.onclick=function(){m.textContent='';var v=lg.value.trim();if(!v||!dt.value){m.textContent='Type the email or phone number on your booking and choose your check-in date.';return}
    g.disabled=true;acctCall('/api/account/find',{login:v,start:dt.value}).then(function(d){g.disabled=false;
      if(d.ok&&d.step==='email')addEmail(v,dt.value);
      else if(d.ok&&d.step==='sent')checkEmail(d.hint||'the email on your booking',d.existing,v,dt.value);
      else m.textContent=d.message||FAIL}).catch(function(){g.disabled=false;m.textContent=FAIL})};
  b.appendChild(g);b.appendChild(m);lnk(b,'Back to sign in',backToSignIn(''))})}
function addEmail(phone,date){openSheet('Add your email',function(b){
  stepNote(b,2);b.appendChild(el('p','We found your booking. We do not have an email for you yet. Your email is where we send your link, and anything about your stay.'));
  var em=fl(b,'ce','Your email','email','');em.autocomplete='email';var m=el('p','','err');m.setAttribute('role','alert');var g=el('button','Send my link');g.style.marginTop='12px';
  g.onclick=function(){m.textContent='';var v=em.value.trim();if(!v){m.textContent='Type your email address.';return}
    g.disabled=true;acctCall('/api/account/claim',{phone:phone,email:v,start:date}).then(function(d){g.disabled=false;if(d.ok)checkEmail(v,false,phone,date);else m.textContent=d.message||FAIL}).catch(function(){g.disabled=false;m.textContent=FAIL})};
  b.appendChild(g);b.appendChild(m);lnk(b,'Back',function(){createAcct(phone,date)})})}
function checkEmail(where,existing,login,date){openSheet('Check your email',function(b){
  stepNote(b,3);b.appendChild(el('p',(existing?'You already have an account. We sent a link to ':'We sent a link to ')+where+'. Open it to choose your password. The link works once and lasts 24 hours.'));
  b.appendChild(el('p','Then come back to this app and sign in.'));
  b.appendChild(el('p','It can take a minute. If it is not there, look in your spam folder.','note'));
  lnk(b,'Start again',function(){createAcct(login,date)});lnk(b,'Back to sign in',backToSignIn(login))})}
function forgotPw(pre){openSheet('Forgot your password?',function(b){
  b.appendChild(el('p','Type the email or phone number you sign in with. We will email a link to choose a new password.'));
  var lg=fl(b,'fl','Email or phone number','text',pre||val());lg.autocomplete='username';var m=el('p','','ok');m.setAttribute('role','status');var g=el('button','Email me a link');g.style.marginTop='12px';
  var again=el('p','Nothing arrived? ');again.style.cssText='text-align:center;margin:12px 0 0';again.hidden=true;var ab=el('a','Find my booking');ab.href='#';ab.style.color='var(--ink)';ab.onclick=function(ev){ev.preventDefault();createAcct(lg.value.trim())};again.appendChild(ab);
  g.onclick=function(){m.textContent='';var v=lg.value.trim();if(!v){m.className='err';m.textContent='Type your email or phone number.';return}
    g.disabled=true;acctCall('/api/account/forgot',{login:v}).then(function(d){g.disabled=false;m.className=d.ok===false?'err':'ok';m.textContent=d.message||'If that sign-in has an email on file, we sent a link to it.';again.hidden=false}).catch(function(){g.disabled=false;m.className='err';m.textContent=FAIL})};
  b.appendChild(g);b.appendChild(m);b.appendChild(again);lnk(b,'Back to sign in',backToSignIn(''))})}
document.getElementById('fg').onclick=function(ev){ev.preventDefault();forgotPw()};
document.getElementById('mk').onclick=function(ev){ev.preventDefault();createAcct()};
document.getElementById('vs').onclick=function(){LS.setItem('visitor','1');location.href='availability.html'};
document.getElementById('sm').onclick=function(){
  LS.setItem('demo','1');
  kvSet('stay',JSON.stringify({id:'demo',t:'demo'})).then(function(){kvSet('profile',JSON.stringify({email:'sample@example.com',name:'Sample Guest',phone:'',others:'',pets:'',nEmail:true,nPush:true})).then(function(){location.href='index.html'})});
};
</script></body></html>
